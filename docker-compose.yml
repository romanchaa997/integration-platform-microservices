version: '3.8'

services:
  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: integration_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ingest Service (Python FastAPI)
  ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./services/ingest:/app

  # Normalize Service (Node.js)
  normalize:
    build:
      context: ./services/normalize
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - ./services/normalize:/app

  # Execute Service (Go)
  execute:
    build:
      context: ./services/execute
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - ./services/execute:/app

  # Writer Service (Python)
  writer:
    build:
      context: ./services/writer
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      CLICKUP_API_TOKEN: ${CLICKUP_API_TOKEN}
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      RABBITMQ_HOST: rabbitmq
      POSTGRES_HOST: postgres
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - ./services/writer:/app

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards.json:/etc/grafana/provisioning/dashboards/dashboards.json

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: integration-platform
